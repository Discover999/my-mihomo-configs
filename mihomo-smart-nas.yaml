# ==================================================================================
# 六、路由规则（自上而下匹配，命中即止）
# ==================================================================================
# · 顺序很重要：私有网络 / 国内直连在前，服务分流居中，兜底规则放在最后。
# · no-resolve 表示匹配 IP 规则时不触发 DNS 解析，避免拖慢首次连接。
# · 修改后可在面板「规则」页查看命中情况；调试时可临时把 log-level 改为 info。

rules:
  # ---------- 前置：私有网络与国内直连 ----------

  - RULE-SET,private,DIRECT # 私有网络
  - RULE-SET,geolocation-cn,DIRECT # 国内域名
  - RULE-SET,games_cn,DIRECT # 国内游戏平台（已含 Steam 下载域名）
  - RULE-SET,epicgames,DIRECT
  - RULE-SET,nvidia_cn,DIRECT
  - RULE-SET,apple_cn,DIRECT
  - RULE-SET,microsoft_cn,DIRECT
  - DOMAIN,fsend.cn,DIRECT
  - DOMAIN,international-gfe.download.nvidia.com,DIRECT # GeForce Experience 国内下载

  # ---------- 屏蔽国外 QUIC（UDP 443），避免代理 UDP 拥塞拖慢视频加载 ----------
  # 国内域名与国内 IP 的 QUIC 不受影响

  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((OR,((RULE-SET,cn),(RULE-SET,cn_ip,no-resolve)))))),REJECT

  # ---------- 广告拦截 ----------

  - RULE-SET,category-ads,AdBlock

  # ---------- 服务分流 ----------

  - RULE-SET,google,Google
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,ai,AI
  - RULE-SET,github,GitHub # GitHub 独立分流
  - RULE-SET,microsoft,Microsoft
  - RULE-SET,microsoft_ip,Microsoft,no-resolve
  - RULE-SET,apple,Apple
  - RULE-SET,apple_ip,Apple,no-resolve
  - RULE-SET,telegram,Telegram
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,steam,Steam
  - RULE-SET,steam_ip,Steam,no-resolve
  - RULE-SET,tiktok,TikTok
  - RULE-SET,tiktok_ip,TikTok,no-resolve
  - RULE-SET,twitter,Twitter
  - RULE-SET,twitter_ip,Twitter,no-resolve

  # ---------- 流媒体分流（兜底前，交给「流媒体」组，可用解锁节点播放） ----------

  - RULE-SET,netflix,流媒体
  - RULE-SET,netflix_ip,流媒体,no-resolve
  - RULE-SET,disney,流媒体
  - RULE-SET,hbo,流媒体
  - RULE-SET,primevideo,流媒体
  - RULE-SET,youtube_stream,流媒体
  - RULE-SET,spotify,流媒体
  - RULE-SET,spotify_ip,流媒体,no-resolve

  # ---------- 兜底 ----------

  - RULE-SET,geolocation-!cn,默认代理 # 其余国外域名
  - RULE-SET,cn_ip,DIRECT # 国内 IP
  - RULE-SET,private_ip,DIRECT # 私有 IP 段
  - MATCH,漏网之鱼 # 其余全部流量
