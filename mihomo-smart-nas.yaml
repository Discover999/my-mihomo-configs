# ==================================================================================
# mihomo Smart 内核配置 · 飞牛 NAS Docker / 局域网手动代理
# ----------------------------------------------------------------------------------
# 内核：vernesong/mihomo（Smart 分支；普通 mihomo 会因 type: smart 启动失败）
# 场景：NAS Docker 部署，局域网设备手动设置 HTTP/SOCKS5 代理（非网关 / TUN）
# 规则：MetaCubeX/meta-rules-dat + bett-rules（补充项）
#
# 使用前必改：
#   1. 「一、订阅」中的 '订阅链接' 换成自己的机场订阅地址
#   2. secret 换成随机长字符串（面板监听 0.0.0.0:9090）
#   订阅 token 等同于账号凭证，请勿提交真实配置。
#
# Docker Compose 参考：
#   services:
#     mihomo:
#       image: ghcr.io/vernesong/mihomo:latest   # Smart 分支镜像；tag 以实际为准
#       container_name: mihomo
#       restart: unless-stopped
#       ports:
#         - "7893:7893"        # 代理端口（HTTP + SOCKS5）
#         - "9090:9090"        # 面板端口
#       volumes:
#         - ./data:/root/.config/mihomo   # 持久化配置、订阅、规则、缓存与 Smart 数据
#       environment:
#         - TZ=Asia/Shanghai
#
#   整目录挂载会覆盖镜像内置 geo 文件；本配置仅使用 rule-providers，不依赖它们。
#
# 局域网设备代理：<NAS内网IP>:7893
# 面板：http://<NAS内网IP>:9090/ui
#
# Smart 组默认使用内置权重算法（uselightgbm: false），冷启动后会逐步稳定。
# 详细原理、参数与调优：见 README.md
# ==================================================================================

# ==================================================================================
# 一、订阅（必改：填入自己的机场订阅链接）
# ==================================================================================

# 订阅公共模板（锚点，勿删）：被下方所有 provider 引用
provider_common: &provider_common
  type: http
  interval: 21600                        # 每 6 小时自动更新订阅（单位：秒）
  proxy: DIRECT                          # 直连拉取订阅；若订阅链接被墙，改为 '默认代理'
  exclude-type: 'direct|reject|rematch'  # 排除订阅中内置的 DIRECT/REJECT 类占位节点
  exclude-filter: '(?i)(群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|电报|无法|说明|使用|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|优惠|福利|邀请|好友|失联|选择|剩余|公益|发布|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|过滤|客户端|⚠️|@|t\.me/\+|\bexpire\b|\bhttps?://|\.com|\btraffic\b)' # 过滤「剩余流量/到期时间/客户端下载」等信息节点
  health-check: # 节点健康检查
    enable: true
    url: 'https://cp.cloudflare.com'     # Cloudflare 连通性检测（轻量 204，国内外皆可达）
    interval: 300                        # 每 5 分钟检测一次
    lazy: true                           # 只检测被使用的节点，节省资源
    expected-status: 204

# 订阅列表：一个机场一组，provider 名称可自定义（仅作标识，不影响策略组）。
# 多订阅时务必保留 override.additional-prefix，避免不同机场节点重名。
# path 为相对路径，相对 mihomo 数据目录（容器内 /root/.config/mihomo）。
proxy-providers:
  机场A:
    <<: *provider_common
    url: '订阅链接' # ← 换成你的机场订阅地址
    path: ./proxy_provider/airport-a.yaml
    override:
      additional-prefix: '[A]'

  机场B:
    <<: *provider_common
    url: '订阅链接'
    path: ./proxy_provider/airport-b.yaml
    override:
      additional-prefix: '[B]'

  # 把每个 '订阅链接' 换成真实订阅地址；不需要的订阅整组删除。
  # provider 名称只作标识，不影响策略组；多订阅时保留 additional-prefix 防重名。

# ==================================================================================
# 二、基础设置
# ==================================================================================

mixed-port: 7893            # HTTP + SOCKS5 混合代理端口（局域网设备代理指向此端口）
allow-lan: true             # 允许局域网设备接入（NAS 部署必开）
bind-address: '*'           # 监听所有网卡（Docker 内即 0.0.0.0）
ipv6: false                 # 关闭 IPv6
mode: rule                  # 规则模式
log-level: silent          # silent 不输出日志；排查问题时改为 warning（保留告警）或 info
unified-delay: true         # 统一延迟计算（剔除握手差异，测速更真实）
tcp-concurrent: true        # TCP 并发连接（多 IP 节点择优）
keep-alive-interval: 1800   # TCP 保活间隔（秒）；移动端可省电，过大会延迟发现死连接
find-process-mode: 'off'    # 关闭进程匹配（流量来自局域网设备，无本机进程概念，关闭可减少开销）

# --- Web 管理面板（局域网可访问） ---
# 监听 0.0.0.0 是为了让局域网设备访问面板；secret 为空或仍为占位值时，
# 同网段任何人都能修改配置，因此务必设置 secret（生成示例：openssl rand -hex 24）。
external-controller: '0.0.0.0:9090'
# 若 9090 已被 NAS 上其他服务占用，改成其他端口并同步修改 Docker 映射。
secret: 'REPLACE_WITH_A_LONG_RANDOM_STRING'  # ⚠️ 部署前必须改成随机长字符串
external-ui: ui             # 面板静态目录（相对 mihomo 数据目录）
external-ui-url: 'https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'
# 国内拉取面板缓慢时，换用加速地址：
# external-ui-url: 'https://gh-proxy.com/https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'
# 备选面板（官方 metacubexd）：
# external-ui-url: 'https://github.com/MetaCubeX/metacubexd/releases/latest/download/compressed-dist.tgz'

# 代理端口免验证 IP 段（仅在设置 authentication 时生效）。
# 注意：它不会绕过 external-controller 的 secret，也不能让面板免密登录。
skip-auth-prefixes:
  - 127.0.0.1/8
  - 192.168.0.0/16          # 整个局域网使用代理时免账号密码（需先配置 authentication）
  - ::1/128

# 以上状态写入数据目录的 cache.db；按上面的整目录挂载可跨容器重建保留。
profile:
  store-selected: true      # 记忆手动切换的策略组选择
  store-fake-ip: true       # 持久化 fake-ip 映射（重启后不失域名映射）
  # smart-collector-size: 100 # Smart：collectdata 数据文件上限（MB），按需调整

# --- Smart 内核全局选项（按需取消注释；普通 mihomo 内核请保持注释） ---
# 使用 LightGBM 还需把「四、策略组」group_smart 中的 uselightgbm 改为 true。
# lgbm-auto-update: true     # 自动下载 / 更新 LightGBM 模型
# lgbm-update-interval: 72   # 模型更新间隔（小时）
# lgbm-url: 'https://gh-proxy.com/https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model.bin'
# 模型文件较大，国内下载慢时可保留 gh-proxy 前缀或换成自己的镜像地址。

# --- TUN（本配置未启用） ---
# 局域网手动代理无需 TUN；如需 NAS 自身全局代理，自行添加 tun 段并授权
# NET_ADMIN 与 /dev/net/tun。

# --- 时间同步：VMess / Trojan / Hysteria 等协议的认证依赖本地时间准确，
#     时间偏差过大会直接导致节点全部失灵，因此必须开启 ---
ntp:
  enable: true
  write-to-system: false     # Docker 内无权限改宿主机时间，保持 false；NAS 宿主机自行同步即可
  server: 'ntp.aliyun.com'
  port: 123
  interval: 60               # 每 60 分钟校时一次（分钟）

# --- 域名嗅探：从流量中嗅探真实域名，提升分流准确性 ---
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
  skip-domain:
    - 'dlg.io.mi.com'       # 米家设备
    - '+.push.apple.com'    # 苹果推送


# ==================================================================================
# 三、DNS（国内外分流解析，防泄漏）
# ==================================================================================
# 局域网使用说明：
#   · 设备通过 7893 代理端口上网时，域名由 mihomo 代理解析，无需单独配置 DNS。
#   · SOCKS5 客户端请启用「远程 DNS / Remote DNS」，否则域名会由客户端本地解析，
#     可能被污染或拿到 fake-ip。
#   · 不要把局域网设备的 DNS 直接指向本服务：fake-ip 返回的 198.18.x.x 只有在
#     经由 mihomo 代理时才有意义。

# 四个 DNS 服务器池（锚点，勿删）：
#   dns_default       → 引导解析（仅用于解析下方 DoH/DoT 服务器自身的域名，纯 IP 直连）
#   dns_proxy_server  → 节点服务器域名解析（国内 DNS 直连，防止节点域名被污染）
#   dns_foreign       → 国外域名解析（DoH 经「默认代理」走代理，防污染）
#   dns_china         → 国内域名解析（直连）
dns_default: &dns_default ['223.5.5.5#DIRECT', '119.29.29.29#DIRECT']
dns_proxy_server: &dns_proxy_server ['https://223.5.5.5/dns-query#DIRECT', 'https://doh.pub/dns-query#DIRECT']
dns_foreign: &dns_foreign ['https://cloudflare-dns.com/dns-query#默认代理', 'https://dns.google/dns-query#默认代理']
dns_china: &dns_china ['https://223.5.5.5/dns-query#DIRECT', 'https://doh.pub/dns-query#DIRECT']

dns:
  enable: true
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-filter: # 以下域名不返回 fake-ip，直接返回真实 IP
    - 'rule-set:private'
    - 'rule-set:fakeip_filter'
    - 'rule-set:geolocation-cn'
    - 'rule-set:googlefcm' # Google 推送长连接对 fake-ip 兼容性差，返回真实 IP
  default-nameserver: *dns_default
  proxy-server-nameserver: *dns_proxy_server
  nameserver: *dns_foreign
  nameserver-policy:
    'rule-set:private': 'system'
    'rule-set:douyin': ['system', '180.184.1.1', '180.184.2.2'] # 抖音走运营商 DNS 优选 CDN
    'rule-set:cn': *dns_china
  direct-nameserver: *dns_china
  direct-nameserver-follow-policy: true

hosts:
  # DNS 服务器域名直连解析（避免鸡生蛋问题）
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'cloudflare-dns.com': ['1.1.1.1', '1.0.0.1']
  'dns.google': ['8.8.8.8', '8.8.4.4']

  # 解决谷歌商店（国区）无法下载的问题
  'services.googleapis.cn': 'services.googleapis.com'

  # 屏蔽哔哩哔哩 PCDN，解决视频 / 直播卡顿
  '+.mcdn.bilivideo.com': ['0.0.0.0']
  '+.mcdn.bilivideo.cn': ['0.0.0.0']
  '+.edge.mountaintoys.cn': ['0.0.0.0']
  '+.h2.smtcdns.net': ['0.0.0.0']


# ==================================================================================
# 四、策略组（Smart 智能择优）
# ==================================================================================
# 【Smart 组说明】
#   · smart 组按历史连接质量动态择优，适合把同一地区 / 同一用途的节点放在一起。
#   · 刚启动时样本不足，会先做常规探测；运行一段时间后权重才趋于稳定。
#   · 可选参数：strategy（sticky-sessions 默认 / round-robin）、policy-priority
#     （按节点名设置权重倍率，如 'Premium:1.3;SG:0.9'）。
#   · uselightgbm=true 需要内核能下载 Model.bin，并配置「二、基础设置」lgbm-* 选项。
#
# 策略组公共模板（锚点，勿删）：
#   group_select → 手动选择组参数（面板显示延迟、剔除失活节点）
#   group_smart  → 智能选择组参数（Smart 内核专属类型，隐藏，仅被上层组引用）
group_select: &group_select
  {
    type: select,
    interval: 600,
    timeout: 3000,
    max-failed-times: 3,
    empty-fallback: REJECT,
    url: 'https://cp.cloudflare.com',
    lazy: true,
  }
group_smart: &group_smart
  {
    type: smart, # Smart 内核专属：按节点历史表现（成功率/延迟/流量/时长）智能择优
    interval: 300,
    timeout: 3000,
    max-failed-times: 3,
    empty-fallback: REJECT,
    url: 'https://cp.cloudflare.com',
    lazy: true,
    include-all: true,
    exclude-type: 'DIRECT',
    icon: 'https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/Auto.svg',
    hidden: true,
    uselightgbm: false, # LightGBM 模型预测；true 需 Model.bin 和 lgbm-* 配置
    collectdata: false, # 收集连接数据用于自训练（生成 smart_weight_data.csv）
    # strategy: sticky-sessions, # 可选：sticky-sessions（默认）| round-robin
    # policy-priority: 'Premium:1.3;SG:0.9', # 可选：按节点名调整权重优先级
  }

# 分流组的出口列表（锚点，勿删）：新增地区后记得同步加入这两个列表
out_proxies: &out_proxies # 纯代理出口
  {
    proxies:
      [
        '默认代理',
        '手动选择',
        '智能选择',
        '负载均衡',
        '香港',
        '日本',
        '美国',
        '新加坡',
        '台湾省',
        '低倍率节点',
        '高倍率节点',
        '其他节点',
      ],
  }
out_proxies_direct: &out_proxies_direct # 代理出口 + 直连（用于国内有服务的厂商）
  {
    proxies:
      [
        '默认代理',
        '手动选择',
        '智能选择',
        '负载均衡',
        'DIRECT',
        '香港',
        '日本',
        '美国',
        '新加坡',
        '台湾省',
        '低倍率节点',
        '高倍率节点',
        '其他节点',
      ],
  }

# 地区 / 倍率过滤器（锚点，勿删）：按订阅节点名称匹配；内核使用 regexp2 引擎，支持零宽断言
# 新增地区（如韩国）三步：
#   1. 在此加一行：kr: &filter_kr { filter: '(?i)(🇰🇷|韩国|首尔|春川|(?<![A-Za-z])KO?R(?![A-Za-z])|korea)' }
#   2. 在下方 proxy-groups 中仿照「香港」复制两个组（改名、改引用、换图标）
#   3. 把 '韩国' 加入 out_proxies / out_proxies_direct / 「默认代理」三处列表
filters:
  hk: &filter_hk { filter: '(?i)(🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|hong\s*kong)' }
  jp: &filter_jp { filter: '(?i)(🇯🇵|日本|东京|大阪|京都|(?<![A-Za-z])JPN?(?![A-Za-z])|japan)' }
  us: &filter_us { filter: '(?i)(🇺🇸|美国|纽约|洛杉矶|旧金山|芝加哥|休斯顿|迈阿密|西雅图|波士顿|华盛顿|拉斯维加斯|圣何塞|圣地亚哥|(?<![A-Za-z])USA?(?![A-Za-z])|america|united\s*states)' }
  sg: &filter_sg { filter: '(?i)(🇸🇬|新加坡|狮城|(?<![A-Za-z])SGP?(?![A-Za-z])|singapore)' }
  tw: &filter_tw { filter: '(?i)(🇹🇼|台湾|台北|高雄|(?<![A-Za-z])TWN?(?![A-Za-z])|taiwan)' }
  low: &filter_low # 低倍率（≤0.5x / 免费 / 官方活动节点）
    {
      filter: '(?i)(?:[*×✕✖⨯⨉x]\s*0\.\d+|0\.\d+\s*(?:倍|[*×✕✖⨯⨉x]))',
    }
  high: &filter_high # 高倍率（≥2x）
    {
      filter: '(?i)(?:[*×✕✖⨯⨉x]\s*(?:[2-9]\d*|[1-9]\d+)(?:\.\d+)?|(?:[2-9]\d*|[1-9]\d+)(?:\.\d+)?\s*(?:倍|[*×✕✖⨯⨉x]))',
    }
  other: &filter_other # 「其他节点」= 排除上面全部地区
    {
      exclude-filter: '(?i)(🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|hong\s*kong|🇯🇵|日本|东京|大阪|京都|(?<![A-Za-z])JPN?(?![A-Za-z])|japan|🇺🇸|美国|纽约|洛杉矶|旧金山|芝加哥|休斯顿|迈阿密|西雅图|波士顿|华盛顿|拉斯维加斯|圣何塞|圣地亚哥|(?<![A-Za-z])USA?(?![A-Za-z])|america|united\s*states|🇸🇬|新加坡|狮城|(?<![A-Za-z])SGP?(?![A-Za-z])|singapore|🇹🇼|台湾|台北|高雄|(?<![A-Za-z])TWN?(?![A-Za-z])|taiwan)',
      exclude-type: 'direct',
    }
  ai: &filter_ai # AI 解锁节点：按节点名关键词筛选
    # 各机场命名习惯不同，请按你的实际节点名增删关键词（用 | 分隔，(?i) 表示忽略大小写）
    # 命中即入选。常见写法：GPT / AI / 解锁 / 原生 / 流媒体 / Netflix ...
    # 若误选，可用下方 exclude-filter 再加排除词
    {
      filter: '(?i)(gpt|chatgpt|openai|claude|anthropic|gemini|bard|copilot|解锁ai|ai解锁|家宽|专线)',
    }
  media: &filter_media # 流媒体解锁节点：按节点名关键词筛选
    # 与 AI 筛选部分重合，但更聚焦视频/音乐平台，避免把纯 AI 节点混进来
    {
      filter: '(?i)(netflix|nf|disney|disney\+|hbo|max|hulu|prime\s*video|amazon|youtube|yt|spotify|tidal|appletv|apple\s*tv|emby|plex|stream|流媒体|解锁|unlock|影视|剧场|动画|番剧|bilibili|哔哩|巴哈|bahamut|原生|native|专线|iepl|iplc|premium|高级)',
    }

proxy-groups:
  # ===== 1. 基础出口（日常只需关注「默认代理」） =====

  - name: '默认代理' # 总出口：按地区选，或交给手动 / 智能 / 负载均衡
    <<: *group_select
    proxies:
      [
        '香港',
        '日本',
        '美国',
        '新加坡',
        '台湾省',
        '手动选择',
        '智能选择',
        '负载均衡',
        '低倍率节点',
        '高倍率节点',
        '其他节点',
      ]
    icon: 'https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/Proxy.svg'

  - name: '手动选择' # 手动指定任意单一节点
    <<: *group_select
    include-all: true
    exclude-type: 'DIRECT'
    icon: 'https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/Static.svg'

  - name: '智能选择' # 全部节点智能择优（Smart 内核，隐藏）
    <<: *group_smart

  - name: '负载均衡' # 同一目标地址尽量固定走同一节点（隐藏）
    type: load-balance
    strategy: 'sticky-sessions'
    interval: 300
    timeout: 3000
    max-failed-times: 3
    empty-fallback: REJECT
    url: 'https://cp.cloudflare.com'
    lazy: true
    include-all: true
    exclude-type: 'DIRECT'
    icon: 'https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/RoundRobin.svg'
    hidden: true

  # ===== 2. 服务分流（想改某服务的出口，改 default-selected 一行即可） =====

  - name: 'Google' # Google 全家桶（含 FCM 推送）
    <<: [*group_select, *out_proxies]
    icon: 'https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/Google.svg'

  - name: 'AI' # 国外 AI 服务（默认走筛选出的「AI 节点」，也可手动切其他出口）
    <<: *group_select
    proxies: # 独立出口列表：AI 节点优先，其余为备选
      [
        'AI 节点',
        '默认代理',
        '手动选择',
        '智能选择',
        '美国',
        '日本',
        '新加坡',
        '香港',
        '台湾省',
        'DIRECT',
      ]
    default-selected: 'AI 节点'
    icon: 'https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/OpenAI.svg'

  - name: 'GitHub' # GitHub（独立出口，便于单独切换节点加速 clone / release 下载）
    <<: [*group_select, *out_proxies]
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/GitHub.png'

  - name: '流媒体' # 未命中前面服务规则的国外视频/音乐流量兜底
