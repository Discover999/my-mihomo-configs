# ==================================================================================
# 五、规则集（全部 mrs 二进制格式，经 jsDelivr 分发）
# ==================================================================================
# · 首次启动会下载全部规则集，之后每 24 小时检查更新一次。
# · path 为相对路径（相对 mihomo 数据目录 /root/.config/mihomo）；
#   挂载 ruleset 目录可避免容器重建后全部重新下载。
# · mrs 为 mihomo 专用二进制格式，不能直接用文本编辑器查看。

# 规则集公共模板（锚点，勿删）：域名类 / IP 类各一个，被下方所有规则集引用
ruleset_domain: &ruleset_domain { type: http, format: mrs, interval: 86400, behavior: domain }
ruleset_ip: &ruleset_ip { type: http, format: mrs, interval: 86400, behavior: ipcidr }

rule-providers:
  # ---------- 直连类 ----------

  private: # 私有网络域名
    <<: *ruleset_domain
    url: 'https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs'
    path: './ruleset/private.mrs'
  private_ip: # 私有网络 IP 段
    <<: *ruleset_ip
    url: 'https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs'
    path: './ruleset/private_ip.mrs'
  geolocation-cn: # 国内域名（含未分类，范围比 cn 大）
